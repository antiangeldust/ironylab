[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ironylab"
version = "1.2.0"
description = "Explainable educational tool for estimating ironic potential"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "IronyLab course"}]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]
llm = ["llama-cpp-python>=0.3"]
llm-hf = ["transformers>=4.44", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["ironylab*"]

